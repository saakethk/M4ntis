[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-annotation"
version = "0.1.0"
description = "Inline text annotation widgets for Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GT Hacks Fall '26" }]
dependencies = [
  "anywidget>=0.9.0",
  "ipywidgets>=8.0.0",
  "traitlets>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ipython>=8.0",
  "jupyterlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/saakethk/gt_hacks_fall_26"

[project.entry-points."ipython.extensions"]
custom_annotation = "custom_annotation.magic"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_annotation"]

[tool.hatch.build.targets.wheel.force-include]
"src/custom_annotation/static" = "custom_annotation/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
